[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icm-llm"
dynamic = ["version"]
description = "Infinite Context Memory (ICM) — O(1) flat or O(log N) tree memory for any LLM. No context limit."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = [
    "llm", "hyperbolic", "memory", "infinite-context",
    "transformer", "huggingface", "deep-learning",
    "attention", "large-language-models", "nlp",
]
authors = [
    { name = "Varshini CB", email = "varshinicb1@github.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "torch>=2.4.0",
    "transformers>=4.40.0",
    "numpy>=1.24.0",
    "tqdm>=4.66.0",
    "sentence-transformers>=2.2.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "websockets>=12.0",
    "build>=1.0",
    "twine>=5.0",
]
cuda = [
    "bitsandbytes>=0.43.0",
    "accelerate>=0.30.0",
]
all = [
    "icm[dev,cuda]",
]

[project.urls]
Homepage = "https://github.com/varshinicb1/hyper-ssm-ultimate"
Repository = "https://github.com/varshinicb1/hyper-ssm-ultimate"
Documentation = "https://github.com/varshinicb1/hyper-ssm-ultimate#readme"
Changelog = "https://github.com/varshinicb1/hyper-ssm-ultimate/releases"

[project.scripts]
icm-server = "applications.icm_server:main"
icm-chat = "applications.cli_chat:main"
icm-demo = "applications.icm_demo:main"

[tool.setuptools.packages.find]
include = ["hyper_ssm*", "applications*"]
namespaces = false

[tool.setuptools.package-data]
"hyper_ssm" = ["csrc/*"]

[tool.setuptools.dynamic]
version = { attr = "hyper_ssm.__version__" }

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:pytest_asyncio.*",
]
