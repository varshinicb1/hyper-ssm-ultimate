<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <radialGradient id="orb1" cx="70%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="30%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <line x1="60" y1="0" x2="60" y2="60" stroke="#30363d" stroke-opacity="0.15" stroke-width="0.5"/>
      <line x1="0" y1="60" x2="60" y2="60" stroke="#30363d" stroke-opacity="0.15" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#orb1)"/>
  <rect width="1280" height="640" fill="url(#orb2)"/>
  <rect width="1280" height="4" fill="url(#bar)"/>
  <rect y="636" width="1280" height="4" fill="url(#bar)" transform="rotate(180 640 638)"/>

  <!-- Badge -->
  <rect x="60" y="80" width="165" height="28" rx="14" fill="#58a6ff" fill-opacity="0.1" stroke="#58a6ff" stroke-opacity="0.3" stroke-width="1"/>
  <circle cx="76" cy="94" r="4" fill="#3fb950"/>
  <text x="88" y="99" font-family="system-ui, sans-serif" font-size="13" fill="#58a6ff">Open Source</text>

  <!-- Main number -->
  <text x="60" y="200" font-family="system-ui, sans-serif" font-size="88" font-weight="800" fill="#58a6ff" letter-spacing="-2">260 bytes</text>
  <text x="60" y="240" font-family="system-ui, sans-serif" font-size="24" fill="#8b949e">per session, forever</text>
  <text x="60" y="300" font-family="system-ui, sans-serif" font-size="34" font-weight="700" fill="#c9d1d9">O(1) Memory for LLMs</text>
  <text x="60" y="335" font-family="system-ui, sans-serif" font-size="17" fill="#8b949e">Replace the KV-cache with a fixed-size hyperbolic state vector.</text>

  <!-- Divider -->
  <rect x="60" y="360" width="50" height="3" rx="1" fill="#58a6ff"/>

  <!-- Right features -->
  <g transform="translate(700, 100)">
    <rect x="0" y="0" width="500" height="440" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    
    <g transform="translate(20, 20)">
      <rect x="0" y="0" width="28" height="28" rx="6" fill="#58a6ff" fill-opacity="0.15"/>
      <text x="7" y="19" font-family="system-ui" font-size="14" fill="#58a6ff">&#9889;</text>
      <text x="40" y="14" font-family="system-ui" font-size="15" font-weight="500" fill="#c9d1d9">Any HuggingFace Model</text>
      <text x="40" y="28" font-family="system-ui" font-size="12" fill="#8b949e">GPT-2, Qwen, Phi-3, Gemma, TinyLlama</text>
    </g>
    <g transform="translate(20, 90)">
      <rect x="0" y="0" width="28" height="28" rx="6" fill="#3fb950" fill-opacity="0.15"/>
      <text x="6" y="19" font-family="system-ui" font-size="14" fill="#3fb950">&#9881;</text>
      <text x="40" y="14" font-family="system-ui" font-size="15" font-weight="500" fill="#c9d1d9">Quantization</text>
      <text x="40" y="28" font-family="system-ui" font-size="12" fill="#8b949e">4-bit NF4 &amp; 8-bit via bitsandbytes</text>
    </g>
    <g transform="translate(20, 160)">
      <rect x="0" y="0" width="28" height="28" rx="6" fill="#a371f7" fill-opacity="0.15"/>
      <text x="7" y="19" font-family="system-ui" font-size="14" fill="#a371f7">&#9744;</text>
      <text x="40" y="14" font-family="system-ui" font-size="15" font-weight="500" fill="#c9d1d9">Persistent Sessions</text>
      <text x="40" y="28" font-family="system-ui" font-size="12" fill="#8b949e">SQLite — survives server restarts</text>
    </g>
    <g transform="translate(20, 230)">
      <rect x="0" y="0" width="28" height="28" rx="6" fill="#d29922" fill-opacity="0.15"/>
      <text x="7" y="19" font-family="system-ui" font-size="14" fill="#d29922">&#128274;</text>
      <text x="40" y="14" font-family="system-ui" font-size="15" font-weight="500" fill="#c9d1d9">API Key Auth</text>
      <text x="40" y="28" font-family="system-ui" font-size="12" fill="#8b949e">Bearer tokens + rate limiting</text>
    </g>
    <g transform="translate(20, 300)">
      <rect x="0" y="0" width="28" height="28" rx="6" fill="#58a6ff" fill-opacity="0.15"/>
      <text x="7" y="19" font-family="system-ui" font-size="14" fill="#58a6ff">&#9733;</text>
      <text x="40" y="14" font-family="system-ui" font-size="15" font-weight="500" fill="#c9d1d9">68 Passing Tests</text>
      <text x="40" y="28" font-family="system-ui" font-size="12" fill="#8b949e">Unit + integration, CI-verified</text>
    </g>
    <g transform="translate(20, 370)">
      <rect x="0" y="0" width="28" height="28" rx="6" fill="#3fb950" fill-opacity="0.15"/>
      <text x="6" y="19" font-family="system-ui" font-size="14" fill="#3fb950">&#9660;</text>
      <text x="40" y="14" font-family="system-ui" font-size="15" font-weight="500" fill="#c9d1d9">Docker Deploy</text>
      <text x="40" y="28" font-family="system-ui" font-size="12" fill="#8b949e">One-command containerized deployment</text>
    </g>
  </g>

  <!-- CTA Button -->
  <rect x="60" y="520" width="220" height="46" rx="8" fill="#238636"/>
  <text x="80" y="549" font-family="system-ui" font-size="16" font-weight="600" fill="white">pip install &amp; try now</text>

  <!-- GitHub URL -->
  <text x="60" y="600" font-family="monospace" font-size="16" fill="#d29922">github.com/varshinicb1/hyper-ssm-ultimate</text>

  <!-- Stats -->
  <g transform="translate(950, 530)">
    <text x="0" y="0" font-family="system-ui" font-size="28" font-weight="700" fill="#3fb950" text-anchor="middle">68</text>
    <text x="0" y="18" font-family="system-ui" font-size="11" fill="#8b949e" text-anchor="middle" letter-spacing="0.5">TESTS</text>
    <text x="80" y="0" font-family="system-ui" font-size="28" font-weight="700" fill="#3fb950" text-anchor="middle">9</text>
    <text x="80" y="18" font-family="system-ui" font-size="11" fill="#8b949e" text-anchor="middle" letter-spacing="0.5">PRESETS</text>
    <text x="170" y="0" font-family="system-ui" font-size="28" font-weight="700" fill="#3fb950" text-anchor="middle">260B</text>
    <text x="170" y="18" font-family="system-ui" font-size="11" fill="#8b949e" text-anchor="middle" letter-spacing="0.5">STATE</text>
  </g>
</svg>
