<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ICM</title>
<style>
:root{
  --bg:#0d1117;
  --surface:#161b22;
  --surface-hover:#1c2128;
  --border:#30363d;
  --text:#e6edf3;
  --text-secondary:#8b949e;
  --text-muted:#6e7681;
  --accent:#58a6ff;
  --accent-subtle:rgba(88,166,255,0.12);
  --green:#3fb950;
  --green-subtle:rgba(63,185,80,0.15);
  --red:#f85149;
  --radius:8px;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;
  --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--font);font-size:14px;line-height:1.5;
  display:flex;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

/* Sidebar */
#sidebar{
  width:280px;min-width:280px;
  background:var(--surface);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
}
#sidebar-header{
  padding:16px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:8px;
}
#sidebar-header h2{font-size:14px;font-weight:600;color:var(--text)}
#sidebar-header .badge{
  font-size:10px;padding:1px 6px;border-radius:6px;
  background:var(--accent-subtle);color:var(--accent);
  font-weight:500;
}
#session-list{flex:1;overflow-y:auto;padding:8px}
.session-item{
  padding:8px 10px;border-radius:6px;cursor:pointer;
  display:flex;align-items:center;gap:8px;
  font-size:13px;color:var(--text-secondary);
  transition:background .1s;
  margin-bottom:2px;
}
.session-item:hover{background:var(--surface-hover)}
.session-item.active{background:var(--accent-subtle);color:var(--text)}
.session-item .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.session-item .count{font-size:11px;color:var(--text-muted)}
.session-item .del{
  opacity:0;background:none;border:none;color:var(--text-muted);
  cursor:pointer;padding:2px 4px;border-radius:4px;font-size:14px;
}
.session-item:hover .del{opacity:1}
.session-item .del:hover{color:var(--red);background:var(--green-subtle)}

#sidebar-footer{padding:8px;border-top:1px solid var(--border)}
#sidebar-footer button{
  width:100%;padding:6px 12px;border-radius:6px;
  border:1px solid var(--border);background:var(--surface);
  color:var(--text-secondary);cursor:pointer;
  font-family:var(--font);font-size:12px;font-weight:500;
  transition:background .1s;
}
#sidebar-footer button:hover{background:var(--surface-hover);color:var(--text)}

/* Main */
#main{flex:1;display:flex;flex-direction:column;min-width:0}

#topbar{
  padding:8px 16px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;
  background:var(--surface);
  font-size:13px;
}
#topbar .title{font-weight:600;color:var(--text)}
#topbar .title span{color:var(--accent)}
#topbar .meta{color:var(--text-muted);font-size:12px;margin-left:auto;display:flex;gap:12px}
#topbar .meta span{white-space:nowrap}

#chat{
  flex:1;overflow-y:auto;padding:16px;
  display:flex;flex-direction:column;gap:6px;
}
.welcome{
  margin:auto;text-align:center;max-width:420px;padding:40px 20px;
}
.welcome h2{font-size:18px;font-weight:600;margin-bottom:6px}
.welcome p{font-size:13px;color:var(--text-secondary);line-height:1.6}
.welcome kbd{
  font-family:var(--mono);background:var(--surface);padding:1px 5px;
  border-radius:4px;font-size:11px;border:1px solid var(--border);
}

.msg{
  max-width:75%;padding:8px 12px;border-radius:8px;
  line-height:1.5;font-size:13.5px;
  white-space:pre-wrap;word-break:break-word;
  animation:fadeIn .15s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.msg.user{
  background:var(--accent);color:#fff;
  align-self:flex-end;border-bottom-right-radius:2px;
}
.msg.assistant{
  background:var(--surface);border:1px solid var(--border);
  align-self:flex-start;border-bottom-left-radius:2px;
}
.msg.system{
  align-self:center;background:transparent;
  color:var(--text-secondary);font-size:12px;
  border:1px solid var(--border);max-width:95%;padding:6px 12px;text-align:center;
}
.msg .ts{font-size:10px;color:var(--text-muted);margin-top:4px;text-align:right}

.typing{
  align-self:flex-start;display:flex;gap:4px;padding:12px 16px;
  background:var(--surface);border:1px solid var(--border);border-radius:8px;
}
.typing span{
  width:6px;height:6px;background:var(--text-muted);border-radius:50%;
  animation:bounce 1.2s infinite;
}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}

/* Input */
#input-bar{padding:8px 16px 12px;background:var(--surface);border-top:1px solid var(--border)}
#input-row{
  display:flex;gap:6px;align-items:flex-end;
  background:var(--bg);border:1px solid var(--border);
  border-radius:8px;padding:4px;
  transition:border-color .15s;
}
#input-row:focus-within{border-color:var(--accent)}
#input-row textarea{
  flex:1;background:transparent;border:none;color:var(--text);
  font-family:var(--font);font-size:14px;
  padding:6px 10px;resize:none;outline:none;
  min-height:24px;max-height:120px;line-height:1.4;
}
#input-row textarea::placeholder{color:var(--text-muted)}
#input-row button{
  background:var(--accent);color:#fff;border:none;
  padding:6px 14px;border-radius:6px;cursor:pointer;
  font-family:var(--font);font-size:13px;font-weight:500;
  transition:opacity .15s;
}
#input-row button:disabled{opacity:.4;cursor:not-allowed}

.error-banner{
  background:var(--red);color:#fff;padding:8px 16px;
  font-size:12px;text-align:center;
}

/* Responsive */
@media(max-width:640px){
  #sidebar{position:fixed;top:0;left:0;bottom:0;z-index:100;transform:translateX(-100%);transition:transform .2s}
  #sidebar.open{transform:translateX(0)}
  .msg{max-width:95%}
  #sidebar-toggle{display:block!important}
}
#sidebar-toggle{display:none;background:none;border:none;color:var(--text);cursor:pointer;font-size:18px;padding:2px 6px}
</style>
</head>
<body>

<div id="sidebar">
  <div id="sidebar-header">
    <h2>ICM</h2>
    <span class="badge" id="backend-badge">flat</span>
  </div>
  <div id="session-list"></div>
  <div id="sidebar-footer">
    <button onclick="createSession()">+ New Session</button>
    <button onclick="exportChat()" style="margin-top:4px">Export</button>
  </div>
</div>

<div id="main">
  <div id="topbar">
    <button id="sidebar-toggle" onclick="sidebarOpen=!sidebarOpen;document.getElementById('sidebar').classList.toggle('open',sidebarOpen)">☰</button>
    <span class="title">ICM <span>Chat</span></span>
    <div class="meta">
      <span id="stat-turns">0 turns</span>
      <span id="stat-bytes">0 B</span>
    </div>
  </div>

  <div id="chat"><div class="welcome" id="welcome-el">
    <h2>Infinite Context Memory</h2>
    <p>Hyperbolic memory for LLMs — 260 B O(1) or O(log N) exact recall.<br>
    No KV-cache. <kbd>Enter</kbd> to send.</p>
  </div></div>

  <div id="input-bar">
    <div id="input-row">
      <textarea id="input" rows="1" placeholder="Message"></textarea>
      <button id="send-btn" onclick="send()">Send</button>
    </div>
  </div>
</div>

<script>
let sid=null, sending=false, sidebarOpen=false;
const c=document.getElementById('chat'), i=document.getElementById('input'), s=document.getElementById('send-btn');
const API=window.location.origin;

i.addEventListener('input',()=>{i.style.height='auto';i.style.height=Math.min(i.scrollHeight,120)+'px'});
i.focus();
i.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});

function a(role,text){
  const w=document.getElementById('welcome-el');if(w)w.remove();
  const d=document.createElement('div');d.className='msg '+role;
  d.textContent=text;
  const t=document.createElement('div');t.className='ts';
  t.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  d.appendChild(t);c.appendChild(d);c.scrollTop=c.scrollHeight;
}
function sys(t){a('system',t)}
function typing(on){
  const e=document.getElementById('typing-el');
  if(!on){if(e)e.remove();return}
  if(e)return;
  const d=document.createElement('div');d.className='typing';d.id='typing-el';
  for(let i=0;i<3;i++)d.appendChild(document.createElement('span'));
  c.appendChild(d);c.scrollTop=c.scrollHeight;
}
function disable(d){i.disabled=d;s.disabled=d;sending=d}

async function api(method,path,body){
  const o={method,headers:{'Accept':'application/json'}};
  if(body){o.headers['Content-Type']='application/json';o.body=JSON.stringify(body)}
  const r=await fetch(API+path,o);
  if(!r.ok){const t=await r.text();throw new Error(t.slice(0,200))}
  return r.headers.get('content-type')?.includes('json')?r.json():r.text();
}

async function send(){
  const t=i.value.trim();if(!t||sending)return;
  i.value='';i.style.height='auto';
  a('user',t);typing(true);disable(true);
  try{
    const d=await api('POST','/chat',{message:t,session_id:sid});
    typing(false);
    sid=d.session_id;
    document.getElementById('stat-turns').textContent=(d.turns_compressed||0)+' turns';
    document.getElementById('stat-bytes').textContent=fmt(d.memory_bytes);
    a('assistant',d.response);
    refresh();
  }catch(e){typing(false);sys('Error: '+e.message)}
  finally{disable(false);i.focus()}
}

function fmt(b){if(!b)return'0 B';if(b<1024)return b+' B';if(b<1048576)return(b/1024).toFixed(1)+' KB';return(b/1048576).toFixed(2)+' MB'}

async function createSession(){
  try{
    const d=await api('POST','/sessions');sid=d.session_id;
    document.getElementById('stat-turns').textContent='0 turns';
    document.getElementById('stat-bytes').textContent='0 B';
    c.innerHTML='';sys('Session: '+sid.slice(0,16)+'…');refresh();
  }catch(e){sys('Error: '+e.message)}
}

async function switchSession(id){
  sid=id;c.innerHTML='';sys('Session: '+id.slice(0,16)+'…');refresh();
  try{
    const h=await api('GET','/admin/sessions/'+id+'/history');
    document.getElementById('stat-turns').textContent=(h.utterance_count||0)+' turns';
    document.getElementById('stat-bytes').textContent=fmt(h.memory_bytes);
    for(const t of(h.history||[]))a(t.role==='user'?'user':'assistant',t.content);
  }catch(e){}
}

async function deleteSession(id){
  if(!confirm('Delete?'))return;
  try{await api('DELETE','/sessions/'+id);if(sid===id){sid=null;c.innerHTML=''};refresh()}
  catch(e){sys('Error: '+e.message)}
}

async function refresh(){
  try{
    const d=await api('GET','/sessions');
    const el=document.getElementById('session-list');
    const items=d.sessions||[];
    el.innerHTML=items.length?items.map(s=>`
      <div class="session-item${s.id===sid?' active':''}">
        <span class="name" onclick="switchSession('${s.id}')">${s.id.slice(0,20)}…</span>
        <span class="count">${s.turns||0}</span>
        <button class="del" onclick="event.stopPropagation();deleteSession('${s.id}')">✕</button>
      </div>`).join(''):'<div style="padding:12px;color:var(--text-muted);font-size:12px">No sessions</div>';
  }catch(e){}
}

async function exportChat(){
  if(!sid){sys('No session');return}
  const f=confirm('Export as JSON? Cancel for Markdown')?'json':'markdown';
  window.open(API+'/sessions/'+encodeURIComponent(sid)+'/export/'+f);
}

// Init
(async()=>{
  try{
    const h=await api('GET','/health');
    if(h.backend)document.getElementById('backend-badge').textContent=h.backend;
    const d=await api('POST','/sessions');
    sid=d.session_id;
    sys('Session ready. Start typing.');
    refresh();
  }catch(e){sys('Server unreachable. Run: icm-server\n'+e.message)}
})();
</script>
</body>
</html>
