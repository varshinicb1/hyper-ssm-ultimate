<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinite Context Memory</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #1a1a2e;
  --bg2: #16213e;
  --bg3: #0f3460;
  --accent: #e94560;
  --text: #eee;
  --text-dim: #8892b0;
  --border: #233554;
  --radius: 8px;
  --font: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  display: flex;
  overflow: hidden;
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent); }

/* Sidebar */
#sidebar {
  width: 280px;
  min-width: 280px;
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  transition: margin-left 0.25s, opacity 0.25s;
  overflow: hidden;
}
#sidebar.collapsed {
  margin-left: -280px;
  opacity: 0;
  pointer-events: none;
}
#sidebar-header {
  padding: 16px;
  border-bottom: 1px solid var(--border);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-dim);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
#sidebar-header button {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 2px 8px;
  border-radius: 4px;
  cursor: pointer;
  font-family: var(--font);
  font-size: 11px;
}
#sidebar-header button:hover { color: var(--text); border-color: var(--accent); }
#session-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}
.session-item {
  padding: 10px 12px;
  border-radius: var(--radius);
  cursor: pointer;
  margin-bottom: 4px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  transition: background 0.15s;
}
.session-item:hover { background: var(--bg3); }
.session-item.active { background: var(--bg3); border-left: 2px solid var(--accent); }
.session-item .sid { color: var(--text); }
.session-item .scount { color: var(--text-dim); font-size: 11px; }
.session-item .sdel {
  background: none;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  font-size: 14px;
  padding: 0 4px;
  line-height: 1;
}
.session-item .sdel:hover { color: var(--accent); }
#sidebar-actions {
  padding: 12px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 6px;
}
#sidebar-actions button {
  flex: 1;
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px;
  border-radius: var(--radius);
  cursor: pointer;
  font-family: var(--font);
  font-size: 11px;
  transition: background 0.15s;
}
#sidebar-actions button:hover { background: var(--accent); border-color: var(--accent); }

/* Main */
#main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

/* Header */
#header {
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
#header h1 {
  font-size: 15px;
  font-weight: 600;
  white-space: nowrap;
}
#header h1 span { color: var(--accent); }
#mem-stats {
  display: flex;
  gap: 16px;
  font-size: 11px;
  color: var(--text-dim);
  flex-wrap: wrap;
  margin-left: auto;
}
#export-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 4px 8px;
  border-radius: 4px;
  cursor: pointer;
  font-family: var(--font);
  font-size: 11px;
}
#export-btn:hover { color: var(--text); border-color: var(--green); }
#stream-toggle {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 4px 8px;
  border-radius: 4px;
  cursor: pointer;
  font-family: var(--font);
  font-size: 11px;
}
#stream-toggle:hover { color: var(--text); }
#stream-toggle.on { border-color: var(--accent); color: var(--accent); }
.stat { white-space: nowrap; }
.stat .label { opacity: 0.6; }
.stat .value { color: var(--text); }

#toggle-sidebar {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 4px 8px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 14px;
  font-family: var(--font);
}
#toggle-sidebar:hover { color: var(--text); border-color: var(--accent); }

/* Chat */
#chat-container {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.welcome {
  text-align: center;
  color: var(--text-dim);
  padding: 60px 20px;
  max-width: 500px;
  margin: auto;
}
.welcome h2 { font-size: 18px; color: var(--text); margin-bottom: 8px; }
.welcome p { font-size: 12px; line-height: 1.8; }
.welcome kbd {
  background: var(--bg3);
  padding: 2px 6px;
  border-radius: 3px;
  font-family: var(--font);
  font-size: 11px;
  border: 1px solid var(--border);
}
/* Messages */
.msg { max-width: 80%; padding: 12px 16px; border-radius: var(--radius); line-height: 1.6; font-size: 13px; white-space: pre-wrap; word-break: break-word; position: relative; }
.msg.user { background: var(--bg2); align-self: flex-end; border-bottom-right-radius: 2px; }
.msg.assistant { background: var(--bg3); align-self: flex-start; border-bottom-left-radius: 2px; }
.msg.system { background: transparent; align-self: center; color: var(--text-dim); font-size: 11px; border: 1px solid var(--border); max-width: 90%; }
.msg .timestamp {
  font-size: 10px;
  color: var(--text-dim);
  opacity: 0.5;
  margin-top: 6px;
  text-align: right;
}
.msg.error { background: #3e1a1a; border: 1px solid var(--accent); }

/* Typing indicator */
.typing { align-self: flex-start; background: var(--bg3); padding: 12px 20px; border-radius: var(--radius); border-bottom-left-radius: 2px; display: flex; gap: 4px; align-items: center; }
.typing .dot { width: 6px; height: 6px; background: var(--text-dim); border-radius: 50%; animation: bounce 1.2s infinite; }
.typing .dot:nth-child(2) { animation-delay: 0.2s; }
.typing .dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }

/* Input */
#input-bar {
  padding: 12px 20px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
  align-items: flex-end;
}
#input-bar textarea {
  flex: 1;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  padding: 10px 14px;
  resize: none;
  outline: none;
  min-height: 42px;
  max-height: 120px;
  line-height: 1.4;
}
#input-bar textarea:focus { border-color: var(--accent); }
#input-bar textarea::placeholder { color: var(--text-dim); opacity: 0.5; }
#input-bar button {
  background: var(--accent);
  border: none;
  color: #fff;
  padding: 10px 20px;
  border-radius: var(--radius);
  cursor: pointer;
  font-family: var(--font);
  font-size: 13px;
  font-weight: 600;
  transition: background 0.15s;
  min-height: 42px;
}
#input-bar button:hover { background: #d63850; }
#input-bar button:disabled { opacity: 0.4; cursor: not-allowed; }

/* Responsive */
@media (max-width: 768px) {
  #sidebar { position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; }
  #sidebar.collapsed { margin-left: -280px; }
  .msg { max-width: 95%; }
  #header h1 { font-size: 13px; }
  #mem-stats { gap: 8px; font-size: 10px; }
}
</style>
</head>
<body>

<!-- Sidebar -->
<div id="sidebar">
  <div id="sidebar-header">
    <span>Sessions</span>
    <button onclick="newSession()">+ New</button>
  </div>
  <div id="session-list"></div>
  <div id="sidebar-actions">
    <button onclick="saveSession()">Save</button>
    <button onclick="loadSession()">Load</button>
  </div>
</div>

<!-- Main -->
<div id="main">
  <div id="header">
    <button id="toggle-sidebar" onclick="toggleSidebar()" title="Toggle sidebar">&#9776;</button>
    <h1>Infinite <span>Context</span> Memory</h1>
    <div id="mem-stats">
      <span class="stat"><span class="label">turns </span><span class="value" id="stat-turns">0</span></span>
      <span class="stat"><span class="label">mem </span><span class="value" id="stat-bytes">0 B</span></span>
      <span class="stat"><span class="label">session </span><span class="value" id="stat-session">—</span></span>
      <button id="export-btn" onclick="exportChat()" title="Export conversation">Export</button>
      <button id="stream-toggle" onclick="toggleStream()" title="Toggle streaming">Stream: OFF</button>
    </div>
  </div>

  <div id="chat-container">
    <div class="welcome" id="welcome">
      <h2>&#8734; Infinite Context Memory</h2>
      <p>
        Each message is compressed into a fixed-size hyperbolic state vector.<br>
        <kbd>Enter</kbd> to send &middot; <kbd>Ctrl+L</kbd> to clear &middot; <kbd>Ctrl+B</kbd> toggle sidebar
      </p>
    </div>
  </div>

  <div id="input-bar">
    <textarea id="input" rows="1" placeholder="Type a message... (use /help for commands)"></textarea>
    <button id="send-btn" onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
// ---- State ----
let currentSessionId = null;
let isSending = false;
let useStreaming = false;
let ws = null;

// ---- DOM refs ----
const chatEl = document.getElementById('chat-container');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const sidebarEl = document.getElementById('sidebar');
const sessionListEl = document.getElementById('session-list');

// ---- Auto-resize textarea ----
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});

// ---- Focus ----
inputEl.focus();

// ---- Keyboard shortcuts ----
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
  if (e.key === 'l' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    clearChat();
  }
  if (e.key === 'b' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    toggleSidebar();
  }
});

// ---- Sidebar ----
let sidebarCollapsed = window.innerWidth < 768;
function toggleSidebar() {
  sidebarCollapsed = !sidebarCollapsed;
  sidebarEl.classList.toggle('collapsed', sidebarCollapsed);
}
if (sidebarCollapsed) sidebarEl.classList.add('collapsed');

// ---- Chat helpers ----
function addMessage(role, content) {
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = content;

  const ts = document.createElement('div');
  ts.className = 'timestamp';
  const now = new Date();
  ts.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  div.appendChild(ts);

  chatEl.appendChild(div);
  scrollToBottom();
  return div;
}

function addSystemMessage(content) {
  const div = document.createElement('div');
  div.className = 'msg system';
  div.textContent = content;
  chatEl.appendChild(div);
  scrollToBottom();
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typing-indicator';
  for (let i = 0; i < 3; i++) {
    const dot = document.createElement('span');
    dot.className = 'dot';
    div.appendChild(dot);
  }
  chatEl.appendChild(div);
  scrollToBottom();
}

function hideTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

function scrollToBottom() {
  chatEl.scrollTop = chatEl.scrollHeight;
}

function clearChat() {
  chatEl.innerHTML = '';
}

function setInputDisabled(disabled) {
  inputEl.disabled = disabled;
  sendBtn.disabled = disabled;
  isSending = disabled;
}

// ---- Memory stats update ----
function updateStats(memory) {
  if (!memory) return;
  document.getElementById('stat-turns').textContent = memory.utterance_count ?? '?';
  const bytes = memory.state_bytes ?? 0;
  document.getElementById('stat-bytes').textContent = formatBytes(bytes);
  if (memory.kv_cache_bytes) {
    const ratio = memory.compression_ratio ?? 0;
    document.getElementById('stat-bytes').title = `KV-cache would be ${formatBytes(memory.kv_cache_bytes)} (${ratio}x larger)`;
  }
}

function formatBytes(b) {
  if (b < 1024) return b + ' B';
  if (b < 1024*1024) return (b/1024).toFixed(1) + ' KB';
  return (b/1024/1024).toFixed(2) + ' MB';
}

function exportChat() {
  const sid = currentSessionId;
  if (!sid) { addSystemMessage('No active session to export.'); return; }
  const format = prompt('Export format: json or markdown', 'markdown');
  if (!format || !['json', 'markdown'].includes(format)) return;
  const a = document.createElement('a');
  a.href = API_BASE + '/sessions/' + encodeURIComponent(sid) + '/export/' + format;
  a.download = sid + '.' + (format === 'json' ? 'json' : 'md');
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function toggleStream() {
  useStreaming = !useStreaming;
  const btn = document.getElementById('stream-toggle');
  btn.textContent = useStreaming ? 'Stream: ON' : 'Stream: OFF';
  btn.classList.toggle('on', useStreaming);
  if (!useStreaming && ws) {
    ws.close();
    ws = null;
  }
}

async function connectWs() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = proto + '//' + location.host + '/chat/ws';
  try {
    ws = new WebSocket(url);
    ws.onclose = () => { ws = null; };
    ws.onerror = () => { ws = null; };
    return true;
  } catch (e) {
    ws = null;
    return false;
  }
}

// ---- API calls ----
const API_BASE = '';

async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(API_BASE + path, opts);
  if (!res.ok) {
    const err = await res.text();
    throw new Error(err || `HTTP ${res.status}`);
  }
  return res.json();
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || isSending) return;

  inputEl.value = '';
  inputEl.style.height = 'auto';

  // Handle commands
  if (text.startsWith('/')) {
    handleCommand(text);
    return;
  }

  // Show user message
  addMessage('user', text);
  showTyping();
  setInputDisabled(true);

  if (useStreaming) {
    await sendMessageStream(text);
    return;
  }

  try {
    const data = await api('POST', '/chat', {
      message: text,
      session_id: currentSessionId,
    });
    hideTyping();
    currentSessionId = data.session_id;
    document.getElementById('stat-session').textContent = data.session_id;
    addMessage('assistant', data.response);
    updateStats(data.memory);
    refreshSessionList();
  } catch (err) {
    hideTyping();
    addMessage('error', 'Error: ' + err.message);
  } finally {
    setInputDisabled(false);
    inputEl.focus();
  }
}

async function sendMessageStream(text) {
  if (!ws) {
    const ok = await connectWs();
    if (!ok) {
      hideTyping();
      addMessage('error', 'WebSocket connection failed');
      setInputDisabled(false);
      inputEl.focus();
      return;
    }
  }

  const msgEl = addMessage('assistant', '');
  let fullResponse = '';
  ws.onmessage = (event) => {
    try {
      const data = JSON.parse(event.data);
      if (data.token) {
        fullResponse += data.token;
        msgEl.textContent = fullResponse;
        scrollToBottom();
      }
      if (data.done) {
        hideTyping();
        currentSessionId = data.session_id;
        document.getElementById('stat-session').textContent = data.session_id;
        if (data.memory_bytes !== undefined) {
          updateStats({ state_bytes: data.memory_bytes, utterance_count: data.turns_compressed });
        }
        refreshSessionList();
        setInputDisabled(false);
        inputEl.focus();
      }
      if (data.error) {
        hideTyping();
        msgEl.textContent = 'Error: ' + data.error;
        msgEl.className = 'msg error';
        setInputDisabled(false);
        inputEl.focus();
      }
    } catch (e) {}
  };

  ws.send(JSON.stringify({ session_id: currentSessionId, message: text }));
}

// ---- Commands ----
function handleCommand(cmd) {
  const parts = cmd.slice(1).split(/\s+/);
  const verb = parts[0].toLowerCase();

  switch (verb) {
    case 'help':
      addSystemMessage(
        'Commands:\n' +
        '  /help       - Show this help\n' +
        '  /new        - Create new session\n' +
        '  /sessions   - List all sessions\n' +
        '  /export     - Export conversation (JSON/Markdown)\n' +
        '  /save       - Save current session\n' +
        '  /load       - Load saved session\n' +
        '  /clear      - Clear chat display\n' +
        '  /stats      - Show memory stats\n\n' +
        'Keyboard:\n' +
        '  Enter       - Send\n' +
        '  Ctrl+L      - Clear chat\n' +
        '  Ctrl+B      - Toggle sidebar'
      );
      break;
    case 'new':
      newSession();
      break;
    case 'sessions':
      refreshSessionList();
      addSystemMessage('Session list refreshed in sidebar.');
      break;
    case 'save':
      saveSession();
      break;
    case 'load':
      loadSession();
      break;
    case 'export':
      exportChat();
      break;
    case 'clear':
      clearChat();
      break;
    case 'stats':
      if (currentSessionId) {
        showTyping();
        api('GET', '/memory/' + currentSessionId)
          .then(info => {
            hideTyping();
            const msg = Object.entries(info).map(([k,v]) => `${k}: ${v}`).join('\n');
            addSystemMessage('Memory Stats:\n' + msg);
            updateStats(info);
          })
          .catch(err => {
            hideTyping();
            addMessage('error', 'Stats error: ' + err.message);
          });
      } else {
        addSystemMessage('No active session. Start chatting or create a new session.');
      }
      break;
    default:
      addSystemMessage('Unknown command: /' + verb + '. Try /help');
  }
  inputEl.focus();
}

// ---- Session management ----
async function newSession() {
  try {
    const data = await api('POST', '/sessions');
    currentSessionId = data.session_id;
    document.getElementById('stat-session').textContent = currentSessionId;
    addSystemMessage('New session created: ' + currentSessionId);
    clearChat();
    updateStats(null);
    document.getElementById('stat-turns').textContent = '0';
    document.getElementById('stat-bytes').textContent = '0 B';
    refreshSessionList();
  } catch (err) {
    addMessage('error', 'Failed to create session: ' + err.message);
  }
}

async function switchSession(id) {
  currentSessionId = id;
  document.getElementById('stat-session').textContent = id;
  clearChat();
  try {
    const info = await api('GET', '/memory/' + id);
    updateStats(info);
    document.getElementById('stat-turns').textContent = info.utterance_count ?? info.message_count ?? '?';
  } catch (_) {
    document.getElementById('stat-turns').textContent = '?';
  }
  addSystemMessage('Switched to session: ' + id);
  refreshSessionList();
}

async function deleteSession(id) {
  if (!confirm('Delete session ' + id + '?')) return;
  try {
    await api('DELETE', '/sessions/' + id);
    if (currentSessionId === id) {
      currentSessionId = null;
      document.getElementById('stat-session').textContent = '—';
      clearChat();
    }
    refreshSessionList();
  } catch (err) {
    addMessage('error', 'Delete failed: ' + err.message);
  }
}

async function refreshSessionList() {
  try {
    const sessions = await api('GET', '/sessions');
    sessionListEl.innerHTML = '';
    for (const s of sessions) {
      const div = document.createElement('div');
      div.className = 'session-item' + (s.id === currentSessionId ? ' active' : '');
      div.innerHTML = `
        <div style="flex:1" onclick="switchSession('${s.id}')">
          <div class="sid">${s.id}</div>
          <div class="scount">${s.message_count} msgs &middot; ${formatBytes(s.memory_bytes)}</div>
        </div>
        <button class="sdel" onclick="event.stopPropagation();deleteSession('${s.id}')">&times;</button>
      `;
      sessionListEl.appendChild(div);
    }
  } catch (_) {}
}

async function saveSession() {
  if (!currentSessionId) {
    addSystemMessage('No active session to save.');
    return;
  }
  try {
    const data = await api('POST', '/sessions/' + currentSessionId + '/save');
    addSystemMessage('Session saved: ' + (data.path || 'ok'));
  } catch (err) {
    addMessage('error', 'Save failed: ' + err.message);
  }
}

async function loadSession() {
  if (!currentSessionId) {
    addSystemMessage('No active session to load into. Create one first.');
    return;
  }
  try {
    const data = await api('POST', '/sessions/' + currentSessionId + '/load');
    addSystemMessage('Session loaded.');
    clearChat();
    refreshSessionList();
    const info = await api('GET', '/memory/' + currentSessionId);
    updateStats(info);
    document.getElementById('stat-turns').textContent = info.utterance_count ?? info.message_count ?? '?';
  } catch (err) {
    if (err.message.includes('404')) {
      addSystemMessage('No saved session found for ' + currentSessionId + '. First save it with /save');
    } else {
      addMessage('error', 'Load failed: ' + err.message);
    }
  }
}

// ---- Init ----
(async function init() {
  try {
    const data = await api('POST', '/sessions');
    currentSessionId = data.session_id;
    document.getElementById('stat-session').textContent = currentSessionId;
    addSystemMessage('Session ' + currentSessionId + ' ready. Start typing!');
    refreshSessionList();
  } catch (err) {
    addMessage('error', 'Could not connect to server at ' + API_BASE + '/chat\n' + err.message + '\n\nMake sure the ICM server is running on http://localhost:8000');
  }
})();
</script>
</body>
</html>
