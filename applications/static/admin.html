<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ICM Admin</title>
<style>
:root{
  --bg:#0d1117;--surface:#161b22;--border:#30363d;
  --text:#e6edf3;--text-secondary:#8b949e;--text-muted:#6e7681;
  --accent:#58a6ff;--green:#3fb950;--red:#f85149;--amber:#d29922;
  --radius:8px;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;
  --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font);padding:24px;line-height:1.5}
h1{font-size:20px;font-weight:600;margin-bottom:4px}
.sub{color:var(--text-secondary);font-size:13px;margin-bottom:24px}
h2{font-size:12px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-bottom:24px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px}
.card .l{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.card .v{font-size:20px;font-weight:600;margin-top:2px}
.card .v.accent{color:var(--accent)}.card .v.green{color:var(--green)}.card .v.red{color:var(--red)}
.note{font-size:11px;color:var(--text-muted);margin-top:2px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:16px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:6px 8px;color:var(--text-muted);font-size:11px;font-weight:600;border-bottom:1px solid var(--border)}
td{padding:6px 8px;border-bottom:1px solid var(--border);color:var(--text-secondary)}
tr:hover td{background:var(--surface)}
td.mono{font-family:var(--mono);font-size:12px}
.tag{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:500}
.tag.green{background:rgba(63,185,80,.15);color:var(--green)}
.tag.accent{background:rgba(88,166,255,.12);color:var(--accent)}
</style>
</head>
<body>
<h1>ICM Admin</h1>
<div class="sub">Infinite Context Memory — Server Dashboard</div>
<div class="stats" id="stats"></div>
<div class="panel"><h2>Sessions</h2><table><thead><tr><th>ID</th><th>Turns</th><th>Memory</th><th>Status</th></tr></thead><tbody id="st"></tbody></table></div>
<div class="panel"><h2>Presets</h2><table><thead><tr><th>Name</th><th>Model ID</th><th>Quant</th><th>Note</th></tr></thead><tbody id="pt"></tbody></table></div>
<script>
const A='';
function f(b){if(!b)return'0 B';if(b<1024)return b+' B';if(b<1048576)return(b/1024).toFixed(1)+' KB';return(b/1048576).toFixed(2)+' MB'}
(async()=>{
  try{
    const[s,ss,pp]=await Promise.all([
      fetch(A+'/admin/stats').then(r=>r.json()).catch(()=>({})),
      fetch(A+'/sessions').then(r=>r.json()).catch(()=>({sessions:[]})),
      fetch(A+'/admin/presets').then(r=>r.json()).catch(()=>({presets:[]})),
    ]);
    document.getElementById('stats').innerHTML=`
      <div class="card"><div class="l">Model</div><div class="v accent" style="font-size:14px">${s.loaded_model||'—'}</div></div>
      <div class="card"><div class="l">Device</div><div class="v" style="font-size:13px;color:var(--text-secondary)">${s.device||'—'}</div></div>
      <div class="card"><div class="l">Backend</div><div class="v" style="font-size:14px">${s.backend||'flat'}</div></div>
      <div class="card"><div class="l">Sessions</div><div class="v accent">${s.in_memory_sessions||0}</div></div>
      <div class="card"><div class="l">State Dim</div><div class="v">${s.state_dim||64}</div></div>
      <div class="card"><div class="l">Quant</div><div class="v ${s.quantize_bits?'green':'amber'}">${s.quantize_bits?s.quantize_bits+'-bit':'none'}</div></div>`;
    const sa=(ss.sessions||[]);
    document.getElementById('st').innerHTML=sa.length?sa.map(s=>`<tr><td class="mono">${s.id.slice(0,24)}…</td><td>${s.turns||0}</td><td>${f(s.memory_bytes)}</td><td><span class="tag green">active</span></td></tr>`).join(''):'<tr><td colspan="4" style="text-align:center;color:var(--text-muted);padding:16px">No sessions</td></tr>';
    const pa=(pp.presets||[]);
    document.getElementById('pt').innerHTML=pa.map(p=>`<tr><td><strong>${p.name}</strong></td><td class="mono">${p.id}</td><td>${p.recommended_quant?p.recommended_quant+'-bit':'—'}</td><td>${p.note||''}</td></tr>`).join('');
  }catch(e){document.getElementById('stats').innerHTML='<div style="color:var(--text-muted)">Error loading stats</div>'}
})();
</script>
</body>
</html>
