<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg2)"/>

  <!-- Chrome window frame -->
  <rect x="50" y="30" width="700" height="540" rx="8" fill="#2d2d44" stroke="#3d3d5c" stroke-width="1"/>
  <!-- Title bar -->
  <rect x="50" y="30" width="700" height="40" rx="8" fill="#252538"/>
  <rect x="50" y="50" width="700" height="20" fill="#252538"/>
  <!-- Window dots -->
  <circle cx="75" cy="50" r="6" fill="#ff5f57"/>
  <circle cx="95" cy="50" r="6" fill="#febc2e"/>
  <circle cx="115" cy="50" r="6" fill="#28c840"/>
  <!-- URL bar -->
  <rect x="240" y="42" width="320" height="22" rx="11" fill="#3d3d5c"/>
  <text x="400" y="57" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#888">chat.openai.com</text>

  <!-- ChatGPT page mockup -->
  <!-- Sidebar -->
  <rect x="50" y="70" width="200" height="500" fill="#212135"/>
  <rect x="55" y="80" width="190" height="35" rx="6" fill="#2d2d44"/>
  <text x="150" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#888">+ New Chat</text>

  <!-- Chat area -->
  <rect x="250" y="80" width="480" height="40" rx="6" fill="#2d2d44"/>
  <text x="490" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#888">Chat history placeholder</text>

  <!-- Chat messages -->
  <rect x="280" y="140" width="420" height="70" rx="8" fill="#2d2d44"/>
  <text x="300" y="165" font-family="system-ui, sans-serif" font-size="12" fill="#666">User message appears here</text>

  <rect x="260" y="230" width="440" height="100" rx="8" fill="#34344a"/>
  <text x="300" y="255" font-family="system-ui, sans-serif" font-size="12" fill="#888">AI response with memory context...</text>
  <text x="300" y="275" font-family="system-ui, sans-serif" font-size="12" fill="#888">Previous conversations referenced</text>

  <!-- Memory extension popup overlay -->
  <g filter="url(#shadow)">
    <rect x="560" y="120" width="190" height="350" rx="8" fill="#1a1a2e" stroke="#667eea" stroke-width="2"/>
  </g>
  <!-- Popup header -->
  <rect x="560" y="120" width="190" height="40" rx="8" fill="#667eea"/>
  <rect x="560" y="142" width="190" height="18" fill="#667eea"/>
  <text x="655" y="146" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="white" font-weight="bold">AI Memory</text>

  <!-- Memory entries -->
  <text x="575" y="180" font-family="system-ui, sans-serif" font-size="11" fill="#b0b0d0" font-weight="bold">Recent Memories</text>

  <!-- Memory 1 -->
  <rect x="570" y="190" width="170" height="45" rx="6" fill="#24243e" stroke="#3d3d5c" stroke-width="1"/>
  <text x="580" y="208" font-family="system-ui, sans-serif" font-size="10" fill="#888">📝 Project planning discussion</text>
  <text x="580" y="224" font-family="system-ui, sans-serif" font-size="9" fill="#666">2 hours ago</text>

  <!-- Memory 2 -->
  <rect x="570" y="242" width="170" height="45" rx="6" fill="#24243e" stroke="#3d3d5c" stroke-width="1"/>
  <text x="580" y="260" font-family="system-ui, sans-serif" font-size="10" fill="#888">💡 Feature idea: smart search</text>
  <text x="580" y="276" font-family="system-ui, sans-serif" font-size="9" fill="#666">Yesterday</text>

  <!-- Memory 3 -->
  <rect x="570" y="294" width="170" height="45" rx="6" fill="#24243e" stroke="#3d3d5c" stroke-width="1"/>
  <text x="580" y="312" font-family="system-ui, sans-serif" font-size="10" fill="#888">🐛 Bug fix: memory leak</text>
  <text x="580" y="328" font-family="system-ui, sans-serif" font-size="9" fill="#666">3 days ago</text>

  <!-- Search bar -->
  <rect x="570" y="350" width="170" height="28" rx="14" fill="#2d2d44"/>
  <text x="655" y="368" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#666">🔍 Search memories...</text>

  <!-- Inject button -->
  <rect x="570" y="388" width="170" height="30" rx="6" fill="#667eea" opacity="0.8"/>
  <text x="655" y="408" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="white">⚡ Inject Context</text>

  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Save indicator -->
  <circle cx="660" y="68" r="5" fill="#28c840"/>
  <text x="670" y="72" font-family="system-ui, sans-serif" font-size="10" fill="#28c840">Saving...</text>
</svg>