<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI Memory</title>
<style>
:root{--bg:#0d1117;--surface:#151b23;--border:#30363d;--text:#e6edf3;--t2:#8b949e;--t3:#6e7681;--blue:#4a7cff;--green:#22c55e;--font:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{width:360px;min-height:400px;background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;-webkit-font-smoothing:antialiased}
header{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
header h1{font-size:14px;font-weight:600}
header h1 span{color:var(--blue)}
header .badge{font-size:10px;color:var(--t3);margin-left:auto}
.controls{padding:8px 14px;border-bottom:1px solid var(--border);display:flex;gap:6px}
.controls input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:6px 10px;color:var(--text);font-family:inherit;font-size:12px;outline:none}
.controls input:focus{border-color:var(--blue)}
.controls input::placeholder{color:var(--t3)}
.controls button{padding:6px 12px;border-radius:6px;border:none;cursor:pointer;font-family:inherit;font-size:11px;font-weight:500;background:var(--blue);color:#fff;transition:opacity .15s;white-space:nowrap}
.controls button:hover{opacity:.85}
#stats{padding:6px 14px;display:flex;gap:16px;font-size:11px;color:var(--t3);border-bottom:1px solid var(--border)}
#stats .val{color:var(--t2);font-weight:600}
#results{flex:1;overflow-y:auto;padding:8px 14px;max-height:380px}
.empty{color:var(--t3);font-size:12px;text-align:center;padding:30px 10px;line-height:1.6}
.result{padding:8px 10px;margin-bottom:4px;border-radius:6px;border:1px solid var(--border);cursor:pointer;transition:all .15s}
.result:hover{border-color:var(--blue);background:rgba(74,124,255,.08)}
.result .topic{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;color:var(--blue);margin-bottom:2px}
.result .text{font-size:12px;color:var(--t2);line-height:1.4}
.result .meta{font-size:10px;color:var(--t3);margin-top:2px}
.result .sim{color:var(--green)}
#footer{padding:8px 14px;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:4px}
#footer a,#footer button{padding:5px 10px;border-radius:5px;border:1px solid var(--border);background:var(--surface);color:var(--t2);cursor:pointer;font-size:10px;font-family:inherit;transition:all .15s;text-decoration:none;display:inline-block}
#footer a:hover,#footer button:hover{border-color:var(--blue);color:var(--text)}
.upsell{background:linear-gradient(135deg,rgba(74,124,255,.12),rgba(167,139,250,.12));border:1px solid rgba(74,124,255,.3);border-radius:8px;padding:8px 12px;margin:0 14px 8px;text-align:center}
.upsell p{font-size:11px;color:var(--t2);margin-bottom:4px}
.upsell a{font-size:11px;font-weight:600;color:var(--blue);text-decoration:none}
</style>
</head>
<body>
<header>
  <h1>🧠 AI <span>Memory</span></h1>
  <span class="badge">ICM</span>
</header>
<div class="controls">
  <input id="search-input" placeholder="Search memories...">
  <button id="search-btn">Search</button>
</div>
<div id="stats">
  <span>Facts: <span class="val" id="fact-count">0</span></span>
  <span>Depth: <span class="val" id="stat-depth">0</span></span>
  <span>Nodes: <span class="val" id="stat-nodes">0</span></span>
</div>
<div class="upsell">
  <p>🧠 Memories stay on this device only.</p>
  <a href="checkout.html" target="_blank">Get ICM Cloud → Sync across devices, GPT-4 included, ₹1,249/mo</a>
</div>
<div id="results">
  <div class="empty">Right-click text on any page and select<br>"Save to AI Memory" to get started.<br><br>Or use the memory panel on ChatGPT.</div>
</div>
<div id="footer">
  <button id="refresh-btn">⟳ Refresh</button>
  <button id="reset-btn" style="color:#ef4444;border-color:rgba(239,68,68,.3)">Clear All</button>
  <a href="https://github.com/sponsors/varshinicb1" target="_blank" style="margin-left:auto">Sponsor</a>
  <a href="https://www.buymeacoffee.com/varshinicb1" target="_blank">☕</a>
</div>
<script src="popup.js"></script>
</body>
</html>
