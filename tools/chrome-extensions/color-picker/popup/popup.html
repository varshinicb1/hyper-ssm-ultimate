<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Color Picker</title>
<style>
:root{--bg:#0d1117;--surface:#151b23;--border:#30363d;--text:#e6edf3;--t2:#8b949e;--t3:#6e7681;--font:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--mono:'SFMono-Regular',Consolas,monospace}
*,*::before,*::after{box-sizing:border-box;margin:0}
body{width:280px;background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;-webkit-font-smoothing:antialiased;padding:14px}
h1{font-size:14px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:6px}
h1 span{background:linear-gradient(135deg,#ff6b6b,#ff9f43);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.preview{width:100%;height:48px;border-radius:8px;border:1px solid var(--border);margin-bottom:10px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;font-weight:600;background:#4a7cff;color:#fff;transition:background .2s}
.buttons{display:flex;gap:6px;margin-bottom:10px}
.buttons button{flex:1;padding:8px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:12px;cursor:pointer;font-family:var(--font);transition:all .15s}
.buttons button:hover{border-color:#4a7cff;color:#4a7cff}
.buttons button.prim{background:#4a7cff;border-color:#4a7cff;color:#fff}
.buttons button.prim:hover{opacity:.85}
.history-label{font-size:10px;color:var(--t3);margin-bottom:4px;display:flex;justify-content:space-between}
.history-wrap{display:flex;flex-wrap:wrap;gap:4px;min-height:28px}
.swatch{width:24px;height:24px;border-radius:4px;border:1px solid var(--border);cursor:pointer;position:relative;transition:transform .1s}
.swatch:hover{transform:scale(1.15);z-index:2}
.formats{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:10px}
.format{padding:5px 8px;border-radius:4px;background:var(--surface);border:1px solid var(--border);font-family:var(--mono);font-size:10px;cursor:pointer;transition:all .15s;color:var(--t2)}
.format:hover{border-color:#4a7cff;color:var(--text);background:rgba(74,124,255,.08)}
.footer{font-size:10px;color:var(--t3);margin-top:10px;text-align:center;border-top:1px solid var(--border);padding-top:8px}
.footer a{color:var(--t2);text-decoration:none}
</style>
</head>
<body>
<h1>🎨 Color <span>Picker Pro</span></h1>
<div class="preview" id="preview">#4A7CFF</div>
<div class="buttons">
  <button class="prim" id="pick-btn">Pick from Page</button>
  <button id="copy-btn">Copy</button>
  <button id="random-btn">Random</button>
</div>
<div class="history-label"><span>Saved Colors</span><span id="h-count">0</span></div>
<div class="history-wrap" id="history"></div>
<div class="formats">
  <div class="format" id="f-hex">#4A7CFF</div>
  <div class="format" id="f-rgb">rgb(74,124,255)</div>
  <div class="format" id="f-hsl">hsl(224,100%,65%)</div>
  <div class="format" id="f-cmyk">cmyk(71%,51%,0%,0%)</div>
</div>
<div class="footer">
  <a href="#" id="clear-btn">Clear history</a> · <a href="https://github.com/varshinicb1/hyper-ssm-ultimate">GitHub</a>
</div>
<script src="popup.js"></script>
</body>
</html>
